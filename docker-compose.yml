services:
  api:
    build: .
    container_name: hermex-api
    ports:
      - "${PORT:-3333}:3333"
    environment:
      PORT: 3333
      DATABASE_URL: file:/data/dev.db
      SEED_ON_START: ${SEED_ON_START:-true}
    volumes:
      - hermex_data:/data
    restart: unless-stopped

volumes:
  hermex_data:
